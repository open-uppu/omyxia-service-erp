<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C15"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="glow" cx="25%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <filter id="dropShadow">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="16" fill="url(#bg)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <circle cx="250" cy="150" r="220" fill="url(#glow)"/>
  
  <g transform="translate(70, 45)">
    <rect width="360" height="32" rx="16" fill="rgba(255,255,255,0.06)" stroke="#A855F7" stroke-width="1"/>
    <circle cx="16" cy="16" r="5" fill="#A855F7"/>
    <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0" letter-spacing="1.5">OMYXIA DECOUPLED MICROSERVICE</text>
  </g>
  
  <text x="70" y="135" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
    Omyxia ERP Microservice 📊
  </text>
  <text x="70" y="175" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="400" fill="#94A3B8">
    Standalone Domain Service with Dedicated PostgreSQL Database &amp; Micro-frontend Remote
  </text>
  
  <g transform="translate(70, 220)" filter="url(#dropShadow)">
    <rect width="320" height="80" rx="12" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#A855F7">ARCHITECTURE</text>
    <text x="20" y="56" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#CBD5E1">Frontend Remote + Backend API + DB</text>
  </g>
  <g transform="translate(420, 220)" filter="url(#dropShadow)">
    <rect width="320" height="80" rx="12" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#10B981">ENTITLEMENT GATING</text>
    <text x="20" y="56" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#CBD5E1">Perimeter Header Validation (X-Tenant-ID)</text>
  </g>
  <g transform="translate(770, 220)" filter="url(#dropShadow)">
    <rect width="320" height="80" rx="12" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#38BDF8">INTEGRATION</text>
    <text x="20" y="56" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#CBD5E1">Mounted in omyxia-portal-shell (:3000)</text>
  </g>
</svg>